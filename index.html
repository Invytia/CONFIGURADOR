<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invytia | Crea tu Invitación</title>
    <!-- Cargamos Tailwind CSS sin instalar nada -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-8 rounded-2xl shadow-lg max-w-md w-full space-y-6">
        <div class="text-center">
            <h1 class="text-2xl font-bold text-gray-900">Configura tu Invitación</h1>
            <p class="text-gray-500 mt-2">Diseño premium, al instante.</p>
        </div>

        <!-- Formulario -->
        <div class="space-y-4">
            <!-- Pases -->
            <div>
                <label class="block text-sm font-medium text-gray-700">Número de personas por pase</label>
                <input type="number" id="passNumber" class="mt-1 block w-full rounded-md border-gray-300 border p-2 focus:ring-black focus:border-black" placeholder="Ej. 2" value="1">
            </div>

            <!-- Opciones Premium -->
            <div class="pt-4 border-t border-gray-200">
                <h3 class="text-sm font-medium text-gray-900 mb-2">Mejoras Premium</h3>
                
                <label class="flex items-center space-x-3 mb-2">
                    <input type="checkbox" id="customSong" class="rounded text-black focus:ring-black h-4 w-4">
                    <span class="text-sm text-gray-700">Añadir canción personalizada (+ Costo extra)</span>
                </label>

                <label class="flex items-center space-x-3">
                    <input type="checkbox" id="promoVideo" class="rounded text-black focus:ring-black h-4 w-4">
                    <span class="text-sm text-gray-700">Añadir video promocional (Se entrega por separado)</span>
                </label>
            </div>
        </div>

        <!-- Botón de Acción -->
        <button onclick="procesarPedido()" class="w-full bg-black text-white font-semibold py-3 px-4 rounded-lg hover:bg-gray-800 transition-colors">
            Continuar
        </button>
    </div>

    <!-- Lógica de Ventas -->
    <script>
        function procesarPedido() {
            const passes = document.getElementById('passNumber').value;
            const wantsCustomSong = document.getElementById('customSong').checked;
            const wantsPromoVideo = document.getElementById('promoVideo').checked;

            if (wantsCustomSong || wantsPromoVideo) {
                // Ruta Premium: Redirigir a WhatsApp
                const mensaje = `Hola Invytia, estoy armando mi invitación para ${passes} personas y me interesa el paquete Premium (Canción/Video).`;
                const url = `https://wa.me/525500000000?text=${encodeURIComponent(mensaje)}`;
                window.open(url, '_blank');
            } else {
                // Ruta Básica: Aquí iría el pago automático / Google Sheets
                alert("Redirigiendo a pasarela de pago para la versión básica...");
            }
        }
    </script>
</body>
</html>
